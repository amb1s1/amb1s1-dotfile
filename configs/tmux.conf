# tmux config — works on macOS and Linux (tmux 2.9+)

# --- General ----------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 100000
set -g mouse on
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g focus-events on

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Splits and windows -----------------------------------------------------
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane movement ----------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl-h/j/k/l moves between panes, but passes through to vim when vim is
# focused. See https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# --- Copy mode --------------------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Copy to the system clipboard with whatever tool this machine has.
# Checked in order, so pbcopy wins on macOS and wl-copy/xclip on Linux.
if-shell 'command -v xclip >/dev/null' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"'
if-shell 'command -v wl-copy >/dev/null' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'
if-shell 'command -v pbcopy >/dev/null' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

# --- Theme ------------------------------------------------------------------
set -g status-style "bg=#333333,fg=#808080"
set -g status-left-length 30
set -g status-left " #S "
set -g status-left-style "bg=#8DB5DA,fg=#333333"
set -g status-right " %H:%M %d-%b-%y "
set -g status-right-style "bg=#8DB5DA,fg=#333333"

setw -g window-status-style "bg=#333333,fg=#808080"
setw -g window-status-current-style "bg=#454545,fg=#8DB5DA"

set -g message-style "bg=#353535,fg=#8DB5DA"
set -g mode-style "bg=#8DB5DA,fg=#333333"
set -g pane-border-style "fg=#454545"
set -g pane-active-border-style "fg=#8DB5DA"
