# ================================
# AeroSpace — David’s Focused Layout
# ================================
# Workspaces:
# 1 Term | 2 Web | 3 Tickets | 4 Docs | 5 Chat/AI | 6 Comms | 7 Music | 9 Scratch
# ================================


start-at-login = false
after-startup-command = [
    # Start JankyBorders so the focused window gets a DFFF52 border
    'exec-and-forget ~/.local/bin/borders active_color=0xffdfff52 inactive_color=0xff494d64 width=12.0',
]

# --- Normalization & layout defaults (from AeroSpace guide/default config) ---
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'      # tiles | accordion
default-root-container-orientation = 'auto'  # horizontal | vertical | auto

# --- Optional: mouse follows focused monitor ---
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# --- Gaps ---
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# ================================
# Keybindings
# ================================
[mode.main.binding]

# Focus between windows
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout toggles
alt-equal     = 'balance-sizes'
alt-f         = 'fullscreen'
alt-space     = 'layout horizontal vertical'   # toggle container orientation
alt-backslash = 'layout tiles accordion'       # toggle layout mode
alt-minus     = 'layout floating tiling'       # toggle floating/tiling

# Enter service mode (reload config, reset tree, join containers).
# NOTE: this MUST live here inside [mode.main.binding]. A bare key placed
# after any [[on-window-detected]] table would silently attach itself to that
# table instead — valid TOML, but AeroSpace never sees the binding.
alt-shift-semicolon = 'mode service'

# Workspace switching
cmd-ctrl-1 = 'workspace 1'
cmd-ctrl-2 = 'workspace 2'
cmd-ctrl-3 = 'workspace 3'
cmd-ctrl-4 = 'workspace 4'
cmd-ctrl-5 = 'workspace 5'
cmd-ctrl-6 = 'workspace 6'
cmd-ctrl-7 = 'workspace 7'
cmd-ctrl-9 = 'workspace 9'

# Move window to workspace (and follow it)
cmd-ctrl-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
cmd-ctrl-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
cmd-ctrl-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
cmd-ctrl-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
cmd-ctrl-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
cmd-ctrl-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
cmd-ctrl-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
cmd-ctrl-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# ================================
# App → Workspace Rules
# ================================
# Order matters; first match wins. (Per Guide’s on-window-detected docs)
# 3 • Jira / Tickets
[[on-window-detected]]
if.window-title-regex-substring = '(^| |·|-|—)Jira( |$)'
run = 'move-node-to-workspace 3'

# 4 • Confluence Docs
[[on-window-detected]]
if.window-title-regex-substring = 'Confluence'
run = 'move-node-to-workspace 4'

# 4 • Bear (personal notes)
[[on-window-detected]]
if.app-id = 'net.shinyfrog.bear'
run = 'move-node-to-workspace 4'

# 5 • Chat / AI — Revo Atlassian AI Chat (Chrome app/tab)
[[on-window-detected]]
if.window-title-regex-substring = '(Revo|Atlassian AI Chat|Atlas(s|)ian AI Chat)'
run = 'move-node-to-workspace 5'

# 5 • ChatGPT desktop app
[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'move-node-to-workspace 5'

# 6 • Slack (both app IDs)
[[on-window-detected]]
if.app-id = 'com.slack.Slack'
run = 'move-node-to-workspace 6'
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 6'

# 6 • Outlook
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace 6'

# 7 • Spotify
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 7'

# 1 • Ghostty Terminal (place before Chrome catch-all)
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

# 2 • Chrome catch-all (MUST BE LAST)
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

# ================================
# Float rules
# ================================
# Dialogs and small utility windows tile badly. Float them instead of letting
# them shove your layout around.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Info$'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'org.hammerspoon.Hammerspoon'
run = ['layout floating']

# ================================
# Service mode
# ================================
# Entered with alt-shift-semicolon, bound above in [mode.main.binding]. Each
# key below acts and returns you to main mode. Config reload lives here, so you
# never need a terminal to pick up an edit to this file.

[mode.service.binding]
esc           = ['reload-config', 'mode main']
r             = ['flatten-workspace-tree', 'mode main']   # reset the tree
f             = ['layout floating tiling', 'mode main']   # toggle float
backspace     = ['close-all-windows-but-current', 'mode main']

# Join the focused window into the neighbouring container.
alt-shift-h   = ['join-with left',  'mode main']
alt-shift-j   = ['join-with down',  'mode main']
alt-shift-k   = ['join-with up',    'mode main']
alt-shift-l   = ['join-with right', 'mode main']

# Restart JankyBorders if it has lost its overlay.
b = ['exec-and-forget ~/.local/bin/borders active_color=0xffdfff52 inactive_color=0xff494d64 width=12.0', 'mode main']
