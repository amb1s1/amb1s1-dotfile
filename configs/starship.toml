# ~/.config/starship.toml
#
# One file, cross-shell: the same prompt in bash, brush and zsh, on macOS and
# Linux. That portability is the main reason to prefer it over a hand-rolled
# prompt.
#
# Shape: directory, git, status symbol — plus the context that actually
# matters for infra work: kube context, terraform workspace, and AWS profile.
# Those three have caused more "wrong environment" incidents than anything
# else a prompt can show.
#
# Validate after editing:  starship config   /   starship explain
# (and render it: `starship prompt >/dev/null` must print nothing on stderr —
# starship keeps invalid format strings as valid TOML and only complains at
# render time.)

add_newline = true
command_timeout = 500

format = """
$hostname\
$directory\
$git_branch$git_status\
$kubernetes$terraform$aws\
$cmd_duration\
$line_break\
$character"""

# --- Hostname ----------------------------------------------------------------
# Only over ssh — on remote (usually Linux) boxes the hostname is the single
# most important thing the prompt can show.
[hostname]
ssh_only = true
format = '[$hostname](bold red) '

# --- Directory --------------------------------------------------------------
[directory]
style = "cyan"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " ro"
read_only_style = "red"

# --- Git --------------------------------------------------------------------
[git_branch]
symbol = ""
# Literal parentheses MUST be backslash-escaped. Unescaped, starship's format
# parser reads "(" as the start of a conditional group and the whole module
# silently fails to render — the TOML is still valid, so only running
# `starship prompt` reveals it.
format = '[\(](240)[$branch](yellow)'
truncation_length = 24

[git_status]
format = '[$all_status$ahead_behind](240)[\)](240) '
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# --- Infra context ----------------------------------------------------------
# The three things worth a prompt slot, because getting them wrong is expensive.

[kubernetes]
disabled = false
symbol = "⎈ "
format = '[$symbol$context( \($namespace\))]($style) '
style = "blue"
# Only show it where a mistake would actually matter.
detect_files = ['Chart.yaml', 'kustomization.yaml', 'skaffold.yaml']
detect_folders = ['manifests', 'k8s', 'charts']

[kubernetes.context_aliases]
# Make production impossible to misread. Extend with your real context names.
'.*prod.*' = "PROD"
'.*staging.*' = "stg"

[terraform]
disabled = false
symbol = "tf "
format = '[$symbol$workspace]($style) '
style = "purple"

[aws]
disabled = false
symbol = "aws"
# `($profile)` and `( \($region\))` are conditional groups: each renders
# nothing at all when its variable is empty, so no stray spaces are left
# behind. Writing `$symbol$profile` with a trailing space in the symbol
# instead produces "aws  (region)" whenever no profile is set.
format = '[$symbol( $profile)( \($region\))]($style) '
style = "yellow"

# Long ambient profile names are worth shortening rather than blanking:
# mapping one to "" leaves the symbol and a double space behind. Profile names
# are machine/work-specific, so add your own aliases here locally, e.g.
#
# [aws.profile_aliases]
# my_long_work_profile_name = "work"

# --- Timing -----------------------------------------------------------------
[cmd_duration]
min_time = 2_000
format = "[$duration](240) "

# --- Prompt character -------------------------------------------------------
# Green on success, red on failure.
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](yellow)"

# --- Deliberately off -------------------------------------------------------
# Language version modules cost a stat() per prompt and you rarely need them
# at a glance. (The previous version of this file had python/node/go/rust
# enabled — turn one back on the day you actually miss it.)
[python]
disabled = true
[golang]
disabled = true
[nodejs]
disabled = true
[rust]
disabled = true
[package]
disabled = true
