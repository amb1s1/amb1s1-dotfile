# Starship prompt — https://starship.rs/config

add_newline = true
command_timeout = 1000

format = """
$directory$git_branch$git_status$git_state\
$python$nodejs$golang$rust\
$kubernetes$aws\
$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " "

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "yellow"

[python]
symbol = " "
format = '[$symbol($virtualenv )]($style)'
style = "yellow"

[nodejs]
symbol = " "
format = '[$symbol($version )]($style)'

[golang]
symbol = " "
format = '[$symbol($version )]($style)'

[rust]
symbol = " "
format = '[$symbol($version )]($style)'

[kubernetes]
# Off by default; flip to true if you want the current context in the prompt.
disabled = true
format = '[⎈ $context](bold blue) '

[aws]
disabled = true

[hostname]
ssh_only = true
format = '[$hostname](bold red) '
