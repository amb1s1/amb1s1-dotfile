# ~/.config/starship.toml
#
# One file, cross-shell: the same prompt in bash, brush and zsh, on macOS and
# Linux. That portability is the main reason to prefer it over a hand-rolled
# prompt.
#
# Shape: directory, git, status symbol — plus the context that actually
# matters for infra work: kube context, terraform workspace, and AWS profile.
# Those three have caused more "wrong environment" incidents than anything
# else a prompt can show.
#
# Validate after editing:  starship config   /   starship explain
# (and render it: `starship prompt >/dev/null` must print nothing on stderr —
# starship keeps invalid format strings as valid TOML and only complains at
# render time.)

add_newline = true
command_timeout = 500

# --- Palette ------------------------------------------------------------------
# TokyoNight Storm, as exact hex values taken from Ghostty's own theme file
# (/Applications/Ghostty.app/Contents/Resources/ghostty/themes/TokyoNight Storm),
# so the prompt and the terminal cannot drift apart. If you change `theme` in
# configs/ghostty, change these too.
#
# These names deliberately shadow starship's built-in colour names, which makes
# every `style = "blue"` below resolve to the exact terminal hex rather than the
# 4-bit ANSI approximation. Verified by rendering the prompt and confirming it
# emits 24-bit escapes (38;2;R;G;B), not 4-bit ones.
#
# NOTHING here uses a Nerd Font glyph. The symbols are plain Unicode that any
# terminal font carries, because this same file renders over ssh on Linux boxes
# where Nerd Fonts are not installed.
palette = "tokyonight_storm"

[palettes.tokyonight_storm]
fg      = "#c0caf5"   # foreground
dim     = "#4e5575"   # bright black — punctuation, timings, anything secondary
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
orange  = "#ff9e64"   # TokyoNight's accent orange; not one of the 16 ANSI slots
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"

format = """
$hostname\
$directory\
$git_branch$git_status\
$kubernetes$terraform$aws\
$cmd_duration\
$line_break\
$character"""

# --- Hostname ----------------------------------------------------------------
# Only over ssh — on remote (usually Linux) boxes the hostname is the single
# most important thing the prompt can show.
[hostname]
ssh_only = true
format = '[$hostname](bold red) '

# --- Directory --------------------------------------------------------------
[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " ro"
read_only_style = "red"

# --- Git --------------------------------------------------------------------
[git_branch]
symbol = ""
# Literal parentheses MUST be backslash-escaped. Unescaped, starship's format
# parser reads "(" as the start of a conditional group and the whole module
# silently fails to render — the TOML is still valid, so only running
# `starship prompt` reveals it.
format = '[\(](dim)[$branch](magenta)'
truncation_length = 24

[git_status]
# The wrapper is dim; each indicator carries its own colour, which nests inside
# the outer style group. Colouring them individually is the point — "clean but
# ahead" and "uncommitted changes" should not look identical at a glance.
#
# `stashed` needs its "$" ESCAPED as \$. starship reads a bare $ as the start of
# a variable name, fails to parse the sub-format, and then renders that indicator
# as NOTHING — no error at the prompt, the stash marker just never appears.
# ${count} and friends below are real variables and are left alone.
#
# This one hides well: it only surfaces in a repo that actually HAS a stash, so
# `starship prompt` in a stash-free repo reports no warning at all. Same shape as
# the unescaped-paren trap. doctor.sh therefore also greps for it statically.
format = '[$all_status$ahead_behind](dim)[\)](dim) '
conflicted = "[=](bold red)"
ahead = "[⇡${count}](green)"
behind = "[⇣${count}](yellow)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold orange)"
untracked = "[?](dim)"
stashed = '[\$](cyan)'
modified = "[!](yellow)"
staged = "[+](green)"
renamed = "[»](magenta)"
deleted = "[✘](red)"

# --- Infra context ----------------------------------------------------------
# The three things worth a prompt slot, because getting them wrong is expensive.

[kubernetes]
disabled = false
symbol = "⎈ "
format = '[$symbol$context( \($namespace\))]($style) '
style = "bold blue"
# Only show it where a mistake would actually matter.
detect_files = ['Chart.yaml', 'kustomization.yaml', 'skaffold.yaml']
detect_folders = ['manifests', 'k8s', 'charts']

[kubernetes.context_aliases]
# Make production impossible to misread. Extend with your real context names.
'.*prod.*' = "PROD"
'.*staging.*' = "stg"

[terraform]
disabled = false
symbol = "tf "
format = '[$symbol$workspace]($style) '
style = "magenta"

[aws]
disabled = false
symbol = "aws"
# `($profile)` and `( \($region\))` are conditional groups: each renders
# nothing at all when its variable is empty, so no stray spaces are left
# behind. Writing `$symbol$profile` with a trailing space in the symbol
# instead produces "aws  (region)" whenever no profile is set.
format = '[$symbol( $profile)( \($region\))]($style) '
style = "orange"

# Long ambient profile names are worth shortening rather than blanking:
# mapping one to "" leaves the symbol and a double space behind. Profile names
# are machine/work-specific, so add your own aliases here locally, e.g.
#
# [aws.profile_aliases]
# my_long_work_profile_name = "work"

# --- Timing -----------------------------------------------------------------
[cmd_duration]
min_time = 2_000
format = "[$duration](dim) "

# --- Prompt character -------------------------------------------------------
# Green on success, red on failure.
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](yellow)"

# --- Deliberately off -------------------------------------------------------
# Language version modules cost a stat() per prompt and you rarely need them
# at a glance. (The previous version of this file had python/node/go/rust
# enabled — turn one back on the day you actually miss it.)
[python]
disabled = true
[golang]
disabled = true
[nodejs]
disabled = true
[rust]
disabled = true
[package]
disabled = true
